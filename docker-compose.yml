version: '3.9'

services:
  iot-chatbot:
    build: .
    container_name: iot-chatbot-app
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./backend/crawler:/app/backend/crawler
    env_file:
      - backend/.env
    working_dir: /app
    restart: unless-stopped